name: Bug report
description: Something in Mega Dashboard doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for the report! Please check that you run the latest version and reloaded the browser (`Ctrl+F5`) first.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the editor on …
        2. Select …
        3. …
  - type: input
    id: version
    attributes:
      label: Mega Dashboard version
      description: Shown in Help (bottom of the dialog).
      placeholder: "1.3.0"
    validations:
      required: true
  - type: input
    id: ha
    attributes:
      label: Home Assistant version
      placeholder: "2026.9.3"
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Chrome 140 on Windows / Home Assistant app on iPhone / …
  - type: textarea
    id: logs
    attributes:
      label: Browser console errors
      description: Press F12 → Console and paste anything red.
      render: text
